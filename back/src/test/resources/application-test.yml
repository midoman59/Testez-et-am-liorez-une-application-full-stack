spring:
  application:
    name: yoga-app-test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    user:
      name: testuser
      password: testpassword

oc:
  app:
    jwtExpirationMs: 86400000
    jwtSecret: testSecretKeyForJwtTokenGenerationAndValidationInTestEnvironmentMustBeLongEnough

logging:
  level:
    org:
      springframework:
        web: DEBUG

